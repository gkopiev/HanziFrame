# Fresh-install / merge reference for HanziFrame second generation.
# DO NOT replace the live /config/automations.yaml with this file wholesale.
# During an existing-install merge, preserve the current automation IDs,
# conditions, entity IDs and every unrelated automation. Adapt the references
# below instead of renaming working entities without a migration plan.

- id: hanziframe_scheduled_word_refresh
  alias: HanziFrame scheduled word refresh
  description: Generates the next word when the Pyscript action becomes available and every 10 minutes, then refreshes the E-Ink display.
  triggers:
    - trigger: time_pattern
      minutes: /10
    - trigger: event
      event_type: service_registered
      event_data:
        domain: pyscript
        service: generate_word_image
  conditions: []
  actions:
    - action: pyscript.generate_word_image
      data: {}
    - action: button.press
      target:
        entity_id: button.hanzi_frame_refresh_chinese_word
      data: {}
  mode: single

- id: hanziframe_manual_word_refresh
  alias: HanziFrame manual word refresh
  description: Runs the full refresh chain when the HanziFrame next-word helper is pressed.
  triggers:
    - trigger: state
      entity_id: input_button.hanziframe_next_word
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
  conditions: []
  actions:
    - action: automation.trigger
      target:
        entity_id: automation.hanziframe_scheduled_word_refresh
      data:
        skip_condition: true
  mode: single

- id: hanziframe_display_style_refresh
  alias: HanziFrame display style refresh
  description: Redraws the current word in the selected style without advancing the vocabulary.
  triggers:
    - trigger: state
      entity_id: input_select.hanziframe_display_style
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
  conditions:
    - condition: template
      value_template: "{{ state_attr('sensor.current_hanzi_word', 'chinese') | default('', true) | length > 0 }}"
  actions:
    - variables:
        result: {}
    - action: pyscript.rerender_current_word
      data:
        chinese: "{{ state_attr('sensor.current_hanzi_word', 'chinese') }}"
        pinyin: "{{ state_attr('sensor.current_hanzi_word', 'pinyin') or '' }}"
        translation: "{{ state_attr('sensor.current_hanzi_word', 'translation') or '' }}"
        word_number: "{{ state_attr('sensor.current_hanzi_word', 'word_number') }}"
        total_words: "{{ state_attr('sensor.current_hanzi_word', 'total_words') }}"
        source: "{{ state_attr('sensor.current_hanzi_word', 'source') or 'custom' }}"
        display_style: "{{ states('input_select.hanziframe_display_style') }}"
      response_variable: result
      continue_on_error: true
    - if:
        - condition: template
          value_template: "{{ result is mapping and result.get('generated') }}"
      then:
        - action: button.press
          target:
            entity_id: button.hanzi_frame_refresh_chinese_word
          data: {}
  mode: queued
  max: 10

- id: hanziframe_display_style_localization
  alias: HanziFrame display style localization
  description: Keeps localized dashboard controls synchronized with the shared renderer state.
  triggers:
    - trigger: state
      entity_id: input_select.hanziframe_display_style
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
      id: canonical
    - trigger: state
      entity_id: input_select.hanziframe_display_style_ru
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
      id: russian
    - trigger: state
      entity_id: input_select.hanziframe_display_style_en
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
      id: english
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: russian
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.hanziframe_display_style
              data:
                option: >-
                  {{ {'Без узоров': 'Без узоров / Plain',
                      'Уголки': 'Уголки / Corners',
                      'Рамка': 'Рамка / Full border'}[trigger.to_state.state] }}
        - conditions:
            - condition: trigger
              id: english
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.hanziframe_display_style
              data:
                option: >-
                  {{ {'Plain': 'Без узоров / Plain',
                      'Corners': 'Уголки / Corners',
                      'Full border': 'Рамка / Full border'}[trigger.to_state.state] }}
        - conditions:
            - condition: trigger
              id: canonical
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.hanziframe_display_style_ru
              data:
                option: >-
                  {{ {'Без узоров / Plain': 'Без узоров',
                      'Уголки / Corners': 'Уголки',
                      'Рамка / Full border': 'Рамка'}[trigger.to_state.state] }}
            - action: input_select.select_option
              target:
                entity_id: input_select.hanziframe_display_style_en
              data:
                option: >-
                  {{ {'Без узоров / Plain': 'Plain',
                      'Уголки / Corners': 'Corners',
                      'Рамка / Full border': 'Full border'}[trigger.to_state.state] }}
  mode: queued
  max: 10

- id: hanziframe_dictionary_management
  alias: HanziFrame dictionary management
  description: Adds words and imports vocabulary through native Home Assistant helpers.
  triggers:
    - trigger: state
      entity_id: input_button.hanziframe_add_word
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
      id: add
    - trigger: state
      entity_id: input_button.hanziframe_import_words
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
      id: bulk
    - trigger: state
      entity_id: input_button.hanziframe_import_csv_file
      not_from:
        - unknown
        - unavailable
      not_to:
        - unknown
        - unavailable
      id: file
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: add
          sequence:
            - variables:
                result: {}
            - action: pyscript.add_chinese_word
              data:
                chinese: "{{ states('input_text.hanziframe_new_chinese') }}"
                pinyin: "{{ states('input_text.hanziframe_new_pinyin') }}"
                translation: "{{ states('input_text.hanziframe_new_translation') }}"
              response_variable: result
              continue_on_error: true
            - if:
                - condition: template
                  value_template: >-
                    {{ result is mapping
                       and 'added' in result
                       and 'skipped' in result
                       and not result.get('error')
                       and not result.get('reason') }}
              then:
                - action: input_text.set_value
                  target:
                    entity_id:
                      - input_text.hanziframe_new_chinese
                      - input_text.hanziframe_new_pinyin
                      - input_text.hanziframe_new_translation
                  data:
                    value: ""
                - action: persistent_notification.dismiss
                  data:
                    notification_id: hanziframe_dictionary_action_failed
              else:
                - action: persistent_notification.create
                  data:
                    notification_id: hanziframe_dictionary_action_failed
                    title: HanziFrame dictionary
                    message: >-
                      The word could not be added.
                      {% if result is mapping %}
                      Reason: {{ result.get('error') or result.get('reason') or 'the service returned no result' }}.
                      {% else %}
                      The service returned no result.
                      {% endif %}
                      The form values were kept.

        - conditions:
            - condition: trigger
              id: bulk
          sequence:
            - variables:
                result: {}
            - action: pyscript.bulk_import_words
              data:
                csv_text: "{{ states('input_text.hanziframe_csv_import_words') }}"
              response_variable: result
              continue_on_error: true
            - if:
                - condition: template
                  value_template: >-
                    {{ result is mapping
                       and 'added' in result
                       and 'skipped' in result
                       and not result.get('error')
                       and not result.get('reason') }}
              then:
                - action: input_text.set_value
                  target:
                    entity_id: input_text.hanziframe_csv_import_words
                  data:
                    value: ""
                - action: persistent_notification.dismiss
                  data:
                    notification_id: hanziframe_dictionary_action_failed
              else:
                - action: persistent_notification.create
                  data:
                    notification_id: hanziframe_dictionary_action_failed
                    title: HanziFrame dictionary
                    message: >-
                      The pasted CSV could not be imported.
                      {% if result is mapping %}
                      Reason: {{ result.get('error') or result.get('reason') or 'the service returned no result' }}.
                      {% else %}
                      The service returned no result.
                      {% endif %}
                      The import field was kept.

        - conditions:
            - condition: trigger
              id: file
          sequence:
            - variables:
                result: {}
            - action: pyscript.import_words_from_csv
              data: {}
              response_variable: result
              continue_on_error: true
            - if:
                - condition: template
                  value_template: >-
                    {{ result is mapping
                       and 'added' in result
                       and 'skipped' in result
                       and not result.get('error')
                       and not result.get('reason') }}
              then:
                - action: persistent_notification.dismiss
                  data:
                    notification_id: hanziframe_dictionary_action_failed
              else:
                - action: persistent_notification.create
                  data:
                    notification_id: hanziframe_dictionary_action_failed
                    title: HanziFrame dictionary
                    message: >-
                      chinese_words.csv could not be imported.
                      {% if result is mapping %}
                      Reason: {{ result.get('error') or result.get('reason') or 'the service returned no result' }}.
                      {% else %}
                      The service returned no result.
                      {% endif %}
  mode: queued
  max: 5
  max_exceeded: silent
